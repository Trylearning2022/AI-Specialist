# Nginx biên: TLS 1.2/1.3, chuyển tiếp tới portal, API Gateway, Keycloak. Mặc định từ chối mọi đường dẫn khác.
worker_processes auto;
events { worker_connections 2048; }
http {
  include /etc/nginx/mime.types;
  server_tokens off;
  sendfile on;
  client_max_body_size 110m;
  log_format main '$remote_addr - $remote_user [$time_local] "$request_method $uri" $status $body_bytes_sent '
                  '"$http_user_agent" rt=$request_time rid=$request_id';
  access_log /var/log/nginx/access.log main;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/pki/server.crt;
    ssl_certificate_key /etc/nginx/pki/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    # Bật xác thực chứng thư phía người dùng (mTLS) khi đơn vị yêu cầu:
    # ssl_client_certificate /etc/nginx/pki/ca.crt; ssl_verify_client on;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://gateway:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_buffering off;               # luồng câu trả lời (SSE)
      proxy_read_timeout 900s;
      proxy_send_timeout 900s;
    }

    location /auth/ {
      proxy_pass http://keycloak:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
      proxy_buffer_size 128k;
      proxy_buffers 4 256k;
    }
    # Trang quản trị Keycloak chỉ mở từ vùng quản trị (sửa dải địa chỉ theo thực tế)
    location /auth/admin/ {
      allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; deny all;
      proxy_pass http://keycloak:8080;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port 443;
    }

    location / {
      proxy_pass http://portal:80;
      proxy_set_header Host $host;
      add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'" always;
    }
  }
}
